name: CI and deploy viewer to GitHub Pages

# Single workflow for the whole project: it runs the Python test suite, then
# builds the OpenLayers viewer bundle, assembles a static site (viewer + demo
# PMTiles), and publishes it to GitHub Pages.
#
# The deploy job only publishes from the release branches (see `if:` below);
# pushes to other branches still run tests and build so CI stays green.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions". After that, every push that touches the code, the viewer or
# the demo archives runs this workflow; you can also run it manually from the
# Actions tab.

on:
  push:
    branches:
      - claude/tippykayak-non-webmercator-da7hns
      - claude/build-status-wfofzt
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - viewer/**
      - examples/*.pmtiles
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - viewer/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e '.[dev]'
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:viewer

      - name: Assemble site
        run: |
          mkdir -p _site/viewer _site/examples
          # The viewer references ./dist/* and ../examples/*, so keep it under
          # /viewer with the archives one level up.
          cp -r viewer/index.html viewer/dist _site/viewer/
          cp examples/*.pmtiles _site/examples/
          # Redirect the site root to the viewer.
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./viewer/">
          <title>tippykayak viewer</title></head>
          <body><a href="./viewer/">tippykayak viewer →</a></body></html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Only publish from the default/release branch; other branches and pull
    # requests still run test + build above, but don't redeploy the live site.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/claude/tippykayak-non-webmercator-da7hns'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
