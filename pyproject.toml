[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tippykayak"
version = "0.1.0"
description = "Generate non-WebMercator PMTiles vector tilesets from GeoJSON or OSM/Geofabrik .osm.pbf on any morecantile TileMatrixSet."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tippykayak contributors" }]
keywords = ["pmtiles", "vector-tiles", "mvt", "morecantile", "tilematrixset", "projection", "openlayers", "openstreetmap", "osm", "geofabrik"]

dependencies = [
    "morecantile>=5.0",
    "pyproj>=3.4",
    "shapely>=2.0",
    "mapbox-vector-tile>=2.0",
    "pmtiles>=3.2",
    "osmium>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Extra readers used only by the example build scripts (e.g. make_arctic.py
# reads the OSM land-polygons shapefile with pyshp). Not needed at runtime.
examples = ["pyshp>=2.3"]

[project.scripts]
tippykayak = "tippykayak.cli:main"

[project.urls]
Homepage = "https://github.com/river-man0/tippykayak"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
