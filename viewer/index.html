<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>tippykayak — non-Mercator PMTiles viewer</title>
  <link rel="stylesheet" href="./dist/ol.css" />
  <style>
    :root {
      /* Black & silver premium theme. */
      --bg: #050507;
      --panel: rgba(17, 18, 21, 0.72);
      --panel-solid: #0e0f12;
      --hair: rgba(208, 214, 224, 0.16);     /* silver hairline */
      --hair-strong: rgba(214, 220, 230, 0.34);
      --ink: #eef0f4;                          /* silver-white */
      --muted: #969ba6;                        /* graphite */
      --silver-a: #f2f4f7;
      --silver-b: #b9c0cc;
      --silver-c: #6f7885;
      --shadow: 0 14px 50px rgba(0, 0, 0, 0.62);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden; }

    /* Map is the hero: pure black with a faint charcoal vignette and a hairline grid. */
    #map { position: fixed; inset: 0; background:
      radial-gradient(130% 110% at 50% 38%, #14161b 0%, #0a0b0e 52%, #050506 100%); }
    #map::after { content: ""; position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 46px 46px; mask-image: radial-gradient(120% 100% at 50% 40%, #000 40%, transparent 78%); }
    #map canvas { filter: contrast(1.02) saturate(0.9); }

    .glass { background: var(--panel); border: 1px solid var(--hair); border-radius: 15px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15); }

    /* Brand — top-left. Chrome mark + wordmark + live CRS readout. */
    #brand { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 5;
      display: flex; align-items: center; gap: 11px; padding: 10px 15px 10px 12px; }
    #brand .mark { width: 27px; height: 27px; flex: none; border-radius: 8px;
      background: conic-gradient(from 220deg, #f4f6f9, #aeb6c2, #7c8592, #dfe4ea, #f4f6f9);
      box-shadow: 0 2px 10px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.35), inset 0 -4px 8px rgba(0,0,0,.25); }
    #brand .title { font-weight: 640; letter-spacing: .3px; font-size: 15px;
      background: linear-gradient(180deg, var(--silver-a), var(--silver-b)); -webkit-background-clip: text;
      background-clip: text; color: transparent; }
    #brand .sub { color: var(--muted); font-size: 11px; margin-top: 1px; white-space: nowrap;
      font-variant-numeric: tabular-nums; }
    #brand .sub .err { color: #ff9aa6; }

    /* Bottom dock — the projection switcher is the hero control. */
    #dock { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
      display: flex; align-items: stretch; gap: 6px; max-width: calc(100vw - 24px); padding: 6px; }
    #dock .lbl { display: flex; align-items: center; padding: 0 8px 0 6px; color: var(--muted);
      font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
    #switch { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
    #switch::-webkit-scrollbar { display: none; }
    .seg { display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      white-space: nowrap; cursor: pointer; border: 1px solid transparent; background: transparent;
      color: var(--muted); font: inherit; padding: 7px 14px; border-radius: 11px; transition: .16s; text-align: left; }
    .seg .n { font-size: 13px; font-weight: 550; color: #c3c8d1; letter-spacing: .1px; }
    .seg .c { font-size: 10px; color: var(--silver-c); font-variant-numeric: tabular-nums; }
    .seg:hover { background: rgba(255,255,255,.045); }
    .seg:hover .n { color: var(--ink); }
    .seg.active { border-color: var(--hair-strong);
      background: linear-gradient(180deg, rgba(240,242,246,.96), rgba(196,203,214,.9));
      box-shadow: 0 3px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7); }
    .seg.active .n { color: #16181c; font-weight: 650; }
    .seg.active .c { color: #40454d; }
    .sep { width: 1px; align-self: stretch; margin: 5px 2px; background: var(--hair); }
    #openBtn { cursor: pointer; border: 1px solid var(--hair); background: rgba(255,255,255,.035);
      color: var(--ink); font: inherit; font-size: 13px; padding: 0 14px; border-radius: 11px; }
    #openBtn:hover { background: rgba(255,255,255,.08); border-color: var(--hair-strong); }

    /* Open popover, above the dock. */
    #opener { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 68px); z-index: 6; width: min(430px, calc(100vw - 24px));
      padding: 14px; }
    #opener[hidden] { display: none; }
    #opener .row { display: flex; gap: 8px; }
    #url { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 11px; color: var(--ink);
      border: 1px solid var(--hair); background: rgba(0,0,0,.35); font: inherit; }
    #url:focus { outline: none; border-color: var(--hair-strong); box-shadow: 0 0 0 3px rgba(210,216,226,.12); }
    #load, .filebtn { cursor: pointer; padding: 10px 14px; border-radius: 11px; border: 1px solid var(--hair);
      background: rgba(255,255,255,.05); color: var(--ink); font: inherit; }
    #load:hover, .filebtn:hover { background: rgba(255,255,255,.1); }
    .filebtn { display: inline-block; margin-top: 8px; }
    .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
    .hint code { color: #c3c8d1; }

    /* Bottom-left readout: active tiling scheme + adaptive legend. */
    #info { position: fixed; left: 14px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 4;
      display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
    #grid { display: flex; gap: 9px; align-items: baseline; padding: 8px 12px; font-size: 11px;
      color: var(--muted); }
    #grid b { color: #c8ccd3; font-weight: 600; letter-spacing: .2px; }
    #grid .z0 { font-variant-numeric: tabular-nums; color: var(--silver-c); }
    #legend { display: flex; gap: 12px; padding: 7px 12px; font-size: 11px; color: var(--muted); }
    #legend[hidden] { display: none; }
    #legend .it { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    #legend .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); }
    #legend .sw.dot { border-radius: 50%; }

    @media (max-width: 760px) {
      #brand .sub { display: none; }
      #info { display: none; }
      #dock .lbl { display: none; }
      #dock { left: 12px; right: 12px; transform: none; max-width: none; }
      #opener { left: 12px; right: 12px; transform: none; width: auto; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="brand" class="glass">
    <div class="mark"></div>
    <div>
      <div class="title">tippykayak</div>
      <div id="meta" class="sub">loading…</div>
    </div>
  </div>

  <div id="info">
    <div id="grid" class="glass"></div>
    <div id="legend" class="glass" hidden></div>
  </div>

  <div id="dock" class="glass">
    <span class="lbl">Projection</span>
    <div id="switch"></div>
    <div class="sep"></div>
    <button id="openBtn">Open…</button>
  </div>

  <div id="opener" class="glass" hidden>
    <div class="row">
      <input id="url" type="text" placeholder="https://…/archive.pmtiles" />
      <button id="load">Load</button>
    </div>
    <label class="filebtn" for="file">Choose a .pmtiles file</label>
    <input id="file" type="file" accept=".pmtiles" hidden />
    <div class="hint">…or drag a <code>.pmtiles</code> onto the map. Remote URLs need CORS + HTTP Range.</div>
  </div>

  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
