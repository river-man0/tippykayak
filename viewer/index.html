<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tippykayak — Arctic PMTiles viewer (OpenLayers)</title>
  <link rel="stylesheet" href="./dist/ol.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b1622; color: #cfe3f7; font: 14px/1.4 system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 1; max-width: 340px;
      background: rgba(11,22,34,.85); border: 1px solid #1d3a52; border-radius: 8px;
      padding: 12px 14px; backdrop-filter: blur(4px);
    }
    #panel h1 { font-size: 15px; margin: 0 0 6px; }
    #switcher { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
    #switcher button {
      text-align: left; cursor: pointer; padding: 6px 9px; border-radius: 6px;
      border: 1px solid #244563; background: #122436; color: #cfe3f7; font: inherit;
    }
    #switcher button.active { border-color: #5aa9ff; background: #1c3d5c; }
    #status { margin-top: 6px; font-size: 12px; color: #9bb4cc; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>tippykayak · Arctic clusters</h1>
    <div>Natural Earth coastlines + ~700 settlements, tiled and point-clustered on
      two Arctic CRSs. Bubble numbers are aggregated counts (centroids weighted by
      population) — zoom in and clusters split apart.</div>
    <div id="switcher"></div>
    <div id="status">loading…</div>
  </div>
  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
