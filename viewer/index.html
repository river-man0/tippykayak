<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tippykayak — polar PMTiles viewer (OpenLayers)</title>
  <link rel="stylesheet" href="./dist/ol.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b1622; color: #cfe3f7; font: 14px/1.4 system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 1; max-width: 320px;
      background: rgba(11,22,34,.85); border: 1px solid #1d3a52; border-radius: 8px;
      padding: 12px 14px; backdrop-filter: blur(4px);
    }
    #panel h1 { font-size: 15px; margin: 0 0 6px; }
    #status { margin-top: 8px; font-size: 12px; color: #9bb4cc; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>tippykayak · UPS Antarctic</h1>
    <div>Non-WebMercator vector PMTiles rendered in its native polar CRS — the
      thing MapLibre can't do yet, and Web Mercator shouldn't.</div>
    <div id="status">loading…</div>
  </div>
  <!-- Self-contained bundle (OpenLayers + proj4 + pmtiles). Build with: npm run build:viewer -->
  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
