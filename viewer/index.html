<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>tippykayak — non-Mercator PMTiles viewer</title>
  <link rel="stylesheet" href="./dist/ol.css" />
  <style>
    :root {
      --bg: #05070d;
      --glass: rgba(14, 20, 32, 0.62);
      --glass-brd: rgba(150, 190, 255, 0.14);
      --ink: #e7eefb;
      --muted: #8ea3c4;
      --accent: #54e3ff;
      --accent2: #7c8cff;
      --shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden; }

    /* Map is the hero: full-bleed, with a deep radial backdrop behind the tiles. */
    #map { position: fixed; inset: 0; background:
      radial-gradient(120% 120% at 50% 35%, #0c1426 0%, #070a13 55%, #04060b 100%); }
    #map canvas { filter: saturate(1.04); }

    /* Brand chip — minimal, top-left. */
    #brand { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 5;
      display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 12px;
      background: var(--glass); border: 1px solid var(--glass-brd); border-radius: 14px;
      box-shadow: var(--shadow); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
    #brand .mark { width: 26px; height: 26px; flex: none; border-radius: 8px;
      background: radial-gradient(circle at 30% 25%, var(--accent), var(--accent2) 70%, #3b2fae);
      box-shadow: 0 0 16px rgba(84, 227, 255, 0.55), inset 0 0 8px rgba(255,255,255,.25); }
    #brand .title { font-weight: 650; letter-spacing: .2px; font-size: 15px; }
    #brand .sub { color: var(--muted); font-size: 11px; margin-top: 1px; white-space: nowrap; }

    /* Bottom dock — glass pill of demo chips + Open. Thumb-reachable, doesn't cloud the map. */
    #dock { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
      display: flex; align-items: center; gap: 6px; max-width: calc(100vw - 24px);
      padding: 6px; background: var(--glass); border: 1px solid var(--glass-brd);
      border-radius: 16px; box-shadow: var(--shadow);
      backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
    #chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    #chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; cursor: pointer; border: 1px solid transparent;
      background: transparent; color: var(--muted); font: inherit; font-size: 13px;
      padding: 8px 13px; border-radius: 11px; transition: .18s; }
    .chip:hover { color: var(--ink); background: rgba(255,255,255,.05); }
    .chip.active { color: #04121a; background: linear-gradient(180deg, var(--accent), #38c6e6);
      box-shadow: 0 0 18px rgba(84,227,255,.5); font-weight: 600; }
    .sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--glass-brd); }
    #openBtn { cursor: pointer; border: 1px solid var(--glass-brd); background: rgba(255,255,255,.04);
      color: var(--ink); font: inherit; font-size: 13px; padding: 8px 13px; border-radius: 11px; }
    #openBtn:hover { background: rgba(255,255,255,.09); }

    /* Open popover, above the dock. */
    #opener { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 60px); z-index: 6; width: min(420px, calc(100vw - 24px));
      padding: 14px; background: var(--glass); border: 1px solid var(--glass-brd); border-radius: 16px;
      box-shadow: var(--shadow); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); }
    #opener[hidden] { display: none; }
    #opener .row { display: flex; gap: 8px; }
    #url { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 11px; color: var(--ink);
      border: 1px solid var(--glass-brd); background: rgba(0,0,0,.28); font: inherit; }
    #url:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(84,227,255,.18); }
    #load, .filebtn { cursor: pointer; padding: 10px 14px; border-radius: 11px; border: 1px solid var(--glass-brd);
      background: rgba(255,255,255,.05); color: var(--ink); font: inherit; }
    #load:hover, .filebtn:hover { background: rgba(255,255,255,.1); }
    .filebtn { display: inline-block; margin-top: 8px; }
    .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
    .err { color: #ff96a6; }

    /* Legend — bottom-left, tiny, fades unless hovered. */
    #legend { position: fixed; left: 14px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 4;
      display: flex; gap: 12px; padding: 8px 12px; font-size: 11px; color: var(--muted);
      background: var(--glass); border: 1px solid var(--glass-brd); border-radius: 12px;
      box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: .85; }
    #legend .it { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    #legend .sw { width: 11px; height: 11px; border-radius: 50%; }

    @media (max-width: 720px) {
      #brand .sub { display: none; }
      #legend { display: none; }
      #dock { left: 12px; right: 12px; transform: none; max-width: none; border-radius: 16px; }
      #opener { left: 12px; right: 12px; transform: none; width: auto; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="brand">
    <div class="mark"></div>
    <div>
      <div class="title">tippykayak</div>
      <div id="meta" class="sub">loading…</div>
    </div>
  </div>

  <div id="legend"></div>

  <div id="dock">
    <div id="chips"></div>
    <div class="sep"></div>
    <button id="openBtn">Open…</button>
  </div>

  <div id="opener" hidden>
    <div class="row">
      <input id="url" type="text" placeholder="https://…/archive.pmtiles" />
      <button id="load">Load</button>
    </div>
    <label class="filebtn" for="file">Choose a .pmtiles file</label>
    <input id="file" type="file" accept=".pmtiles" hidden />
    <div class="hint">…or drag a <code>.pmtiles</code> onto the map. Remote URLs need CORS + HTTP Range.</div>
  </div>

  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
